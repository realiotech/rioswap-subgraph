specVersion: 0.0.5
schema:
  file: ./src/schema.graphql
features:
  - nonFatalErrors
  - grafting
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: mainnet
    source:
      abi: Factory
      address: "0x46FA600414d466b12B7D87BAAb822F8cFc6564b5"
      startBlock: 4789189
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/v3/mappings/factory.ts
      entities:
        - Pool
        - Token
      abis:
        - name: Factory
          file: ./abis/factory.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/ERC20NameBytes.json
        - name: Pool
          file: ./abis/pool.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
  # Uniswap v2 (src/v2): pairs from the v2 factory deployed by rioswap-v3's
  # packages/contracts/scripts/deploy-v2.ts, starting at its deploy block.
  - kind: ethereum/contract
    name: V2Factory
    network: mainnet
    source:
      abi: Factory
      address: "0xF1A8079aAbE5b80c7A558535d284aF0193Fc2c7E"
      startBlock: 7642102
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/v2/mappings/factory.ts
      entities:
        - Pair
        - V2Token
      abis:
        - name: Factory
          file: ./abis/v2/factory.json
        - name: ERC20
          file: ./abis/v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/v2/ERC20NameBytes.json
        - name: ERC20BigDecimals
          file: ./abis/v2/ERC20BigDecimals.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256)
          handler: handleNewPair
  # Uniswap v4 (src/v4): every pool of the PoolManager deployed by
  # deploy-v4.ts, starting at its deploy block.
  - kind: ethereum/contract
    name: PoolManager
    network: mainnet
    source:
      abi: PoolManager
      address: "0xd4A554F23421faF2c79C2432B2092bB1e3016258"
      startBlock: 7643916
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/v4/mappings/poolManager.mapping.ts
      entities:
        - V4Pool
        - V4Token
        - V4Position
      abis:
        - name: ERC20
          file: ./abis/v4/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/v4/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/v4/ERC20NameBytes.json
        - name: PoolManager
          file: ./abis/v4/PoolManager.json
        - name: AggregatorHook
          file: ./abis/v4/AggregatorHook.json
      eventHandlers:
        - event: Initialize(indexed bytes32,indexed address,indexed address,uint24,int24,address,uint160,int24)
          handler: handleInitialize
        - event: ModifyLiquidity(indexed bytes32,indexed address,int24,int24,int256,bytes32)
          handler: handleModifyLiquidity
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap
  # v4 position NFTs (src/v4/mappings/positionManager.ts)
  - kind: ethereum/contract
    name: PositionManager
    network: mainnet
    source:
      abi: PositionManager
      address: "0x38c286d406802557351AB14E352D88d7d22a7746"
      startBlock: 7643920
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/v4/mappings/positionManager.ts
      entities:
        - V4Position
      abis:
        - name: PositionManager
          file: ./abis/v4/PositionManager.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
templates:
  - kind: ethereum/contract
    name: Pool
    network: mainnet
    source:
      abi: Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/v3/mappings/core.ts
      entities:
        - Pool
        - Token
      abis:
        - name: Pool
          file: ./abis/pool.json
        - name: Factory
          file: ./abis/factory.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,indexed address,indexed int24,indexed
            int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleBurn
        - event: Collect(indexed address,address,indexed int24,indexed
            int24,uint128,uint128)
          handler: handleCollect
  - kind: ethereum/contract
    name: Pair
    network: mainnet
    source:
      abi: Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/v2/mappings/core.ts
      entities:
        - Pair
        - V2Token
      abis:
        - name: Pair
          file: ./abis/v2/pair.json
        - name: Factory
          file: ./abis/v2/factory.json
      eventHandlers:
        - event: Mint(indexed address,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address)
          handler: handleBurn
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Sync(uint112,uint112)
          handler: handleSync
